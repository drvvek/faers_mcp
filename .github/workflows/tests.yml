name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  offline:
    name: offline tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not live" -q

  # Live contract tests hit the real openFDA API and pin undocumented behaviour
  # (.exact case sensitivity, the "time" key on date histograms, caret terms).
  # They run on a schedule so an upstream change surfaces as a failed run rather
  # than as silently wrong numbers - but never gate a pull request.
  live:
    name: live openFDA contract
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m live -q
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        continue-on-error: true
